name: Build MeloNX 2.7 IPA (unsigned)

on:
  push:
    branches: [ master ]
    paths:
      - ".github/workflows/build-ipa.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: melonx-ipa-build
  cancel-in-progress: false

jobs:
  build-ipa:
    runs-on: macos-26
    timeout-minutes: 120

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      NUGET_XMLDOC_MODE: skip

    steps:
      - name: Checkout build workflow
        uses: actions/checkout@v4

      - name: Fetch official MeloNX 2.7 source
        shell: bash
        run: |
          git clone --depth 1 --branch 2.7 https://starforgejo.dev/projects/MeloNX.git upstream
          test -f upstream/global.json
          test -f upstream/distribution/ios/build.sh
          test -f upstream/src/MeloNX/MeloNX.xcodeproj/project.pbxproj

          UPSTREAM_COMMIT="$(git -C upstream rev-parse HEAD)"
          echo "Official MeloNX 2.7 commit: $UPSTREAM_COMMIT"
          case "$UPSTREAM_COMMIT" in
            13700519f3*) ;;
            *)
              echo "::error::Tag 2.7 resolved to an unexpected commit: $UPSTREAM_COMMIT"
              exit 1
              ;;
          esac
          echo "UPSTREAM_COMMIT=$UPSTREAM_COMMIT" >> "$GITHUB_ENV"

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: upstream/global.json

      - name: Redirect retired LibHac package feed
        working-directory: upstream
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path

          config = Path("nuget.config")
          tree = ET.parse(config)
          root = tree.getroot()
          replacement = "https://nuget.ryulynx.org/v3/index.json"
          found = False

          for source in root.findall("./packageSources/add"):
              if source.get("key") == "LibHacAlpha":
                  source.set("value", replacement)
                  found = True

          if not found:
              raise SystemExit("LibHacAlpha source was not found in upstream/nuget.config")

          tree.write(config, encoding="utf-8", xml_declaration=True)
          print(f"LibHacAlpha now uses {replacement} (community package mirror)")
          PY

      - name: Preflight restore of the iOS emulator core
        working-directory: upstream
        run: |
          dotnet restore src/Ryujinx.Library/Ryujinx.Library.csproj \\
            --runtime ios-arm64 \\
            --configfile nuget.config \\
            --verbosity normal

      - name: Install .NET iOS workload
        run: dotnet workload install ios

      - name: Make dotnet visible to Xcode's build script
        run: sudo ln -sf "$(command -v dotnet)" /usr/local/bin/dotnet

      - name: Select latest installed Xcode
        shell: bash
        run: |
          XCODE_PATH="$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)/Contents/Developer"
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          dotnet --info
          dotnet workload list

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-melonx-2.7-${{ hashFiles('upstream/global.json', 'upstream/**/*.csproj', 'upstream/Directory.Packages.props') }}
          restore-keys: |
            ${{ runner.os }}-nuget-melonx-

      - name: Cache compiled iOS Ryujinx core
        id: core-cache
        uses: actions/cache@v4
        with:
          path: upstream/src/Ryujinx.Library/bin
          key: ${{ runner.os }}-melonx-2.7-core-${{ hashFiles('upstream/src/**', '!upstream/src/MeloNX/**', 'upstream/global.json', 'upstream/Directory.Packages.props', 'upstream/nuget.config', 'upstream/distribution/ios/build.sh') }}

      - name: Mark core cache hit
        if: steps.core-cache.outputs.cache-hit == 'true'
        run: touch .ci-core-cache-hit
        working-directory: upstream

      - name: Archive unsigned iOS app
        working-directory: upstream
        shell: bash
        run: |
          mkdir -p build
          xcodebuild archive \
            -project src/MeloNX/MeloNX.xcodeproj \
            -scheme MeloNX \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MeloNX.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            SWIFT_OPTIMIZATION_LEVEL=-Onone

      - name: Package IPA and build metadata
        working-directory: upstream
        shell: bash
        run: |
          APP_PATH="build/MeloNX.xcarchive/Products/Applications/MeloNX.app"
          test -d "$APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          (
            cd build
            zip -qry MeloNX-2.7-unsigned.ipa Payload
          )
          shasum -a 256 build/MeloNX-2.7-unsigned.ipa > build/MeloNX-2.7-unsigned.ipa.sha256
          {
            echo "Version: MeloNX 2.7"
            echo "Source: https://starforgejo.dev/projects/MeloNX"
            echo "Tag: 2.7"
            echo "Commit: $UPSTREAM_COMMIT"
            echo "Build: unsigned iOS archive"
          } > build/source-info.txt

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: MeloNX-2.7-unsigned-IPA
          path: |
            upstream/build/MeloNX-2.7-unsigned.ipa
            upstream/build/MeloNX-2.7-unsigned.ipa.sha256
            upstream/build/source-info.txt
          if-no-files-found: error
          retention-days: 14
